[tox]
minversion=3.1
envlist = py{311,312,313,314,315}

[testenv]
deps=
    pytest
    pytest-faulthandler
    pytest-xvfb; sys_platform=="linux"
passenv=
    PYQT_VERSION
    QT_VERSION
setenv=
    qt5: MAJOR = 5
    qt6: MAJOR = 6
;    SYSTEM_VERSION_COMPAT = 0
commands=
    {envbindir}/pip freeze
    {envbindir}/pytest --capture=no qt{env:MAJOR}_applications.tests --pyargs
