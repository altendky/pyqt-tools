name: Set up
description: Set up Python, system packages, and build tools for a build or test job.

inputs:
  python-version:
    description: Python version to use outside of Linux containers.
    required: true
  venv:
    description: Create a virtualenv in the workspace and use it for later steps, as tox did.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      if: runner.os != 'Linux'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        apt-get update --yes
        apt-get install --yes libgl1-mesa-dev libdbus-1-3 libxcursor1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-util1 libxcb-xinerama0 libxcb-xfixes0 xvfb x11-utils
    - name: Create virtualenv
      if: inputs.venv == 'true'
      shell: bash
      # The path added is built from GITHUB_WORKSPACE only.
      run: | # zizmor: ignore[github-env]
        python -m venv "$GITHUB_WORKSPACE/venv"
        if [ "$RUNNER_OS" = Windows ]; then
          bin="$GITHUB_WORKSPACE/venv/Scripts"
        else
          bin="$GITHUB_WORKSPACE/venv/bin"
        fi
        echo "$bin" >> "$GITHUB_PATH"
    - name: Install build tools
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        python -m pip install --upgrade pip build
    - name: Report info
      shell: bash
      run: |
        git show --quiet HEAD
        python --version --version
        python -m pip --version
        python -m pip freeze --all
        python -c "import sysconfig; print('Py_ENABLE_SHARED -> {}'.format(sysconfig.get_config_var('Py_ENABLE_SHARED')))"
        python -c 'import sys; print("sys.maxsize:", sys.maxsize, sys.maxsize > 2**32)'
