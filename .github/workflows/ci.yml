name: CI

on:
  push:
    branches:
      - main
    tags:
      - qt-applications-v*
      - qt-tools-v*
      - pyqt-plugins-v*
      - pyqt-tools-v*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Change to discard all cached wheels.
  CACHE_VERSION: v2

# Packages depend on each other in this order:
#   qt-applications -> qt-tools -> pyqt-plugins -> pyqt-tools
# Wheels built earlier in the run are passed along as artifacts and pinned with
# pip constraints so tests and builds use them instead of releases from PyPI.
# Built wheels are cached keyed on the package sources, which include each
# package's version file, except for tag builds which publish and so always
# build fresh.
#
# Releases: after main's `all` passes, tag-release tags each new package
# version.  The run for the most upstream tag at that commit publishes every
# package tagged there; the other tag runs build nothing.  See
# docs/release.md.

jobs:
  mise:
    name: Mise lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          install_args: --locked --dry-run
          cache: false

  pre-commit:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: false
      # Tag builds publish, so they don't use the cache.
      - if: github.ref_type != 'tag' # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock', '.mise/locks/**') }}
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Release script tests
        run: mise run release-test

  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      packages: ${{ steps.plan.outputs.packages }}
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag runs compare with earlier release tags.
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - id: plan
        run: python3 scripts/release.py plan

  config:
    name: Config
    needs: release-plan
    # Skips everything in tag runs that another tag run publishes for.
    if: needs.release-plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      qt: ${{ steps.config.outputs.qt }}
      python: ${{ steps.config.outputs.python }}
      build_python: ${{ steps.config.outputs.build_python }}
      platforms: ${{ steps.config.outputs.platforms }}
      exclude: ${{ steps.config.outputs.exclude }}
      pyqt_exclude: ${{ steps.config.outputs.pyqt_exclude }}
      other_pythons: ${{ steps.config.outputs.other_pythons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: config
        run: |
          config=.github/ci-config.json
          {
            echo "qt=$(jq --compact-output .qt "$config")"
            echo "python=$(jq --compact-output .python "$config")"
            echo "build_python=$(jq --raw-output '.["build-python"]' "$config")"
            echo "platforms=$(jq --compact-output .platforms "$config")"
            echo "exclude=$(jq --compact-output '.exclude // []' "$config")"
            # PyQt jobs also skip combinations PyQt itself does not support.
            echo "pyqt_exclude=$(jq --compact-output '(.exclude // []) + (.["pyqt-exclude"] // [])' "$config")"
            echo "other_pythons=$(jq --compact-output '.["other-pythons"]' "$config")"
          } | tee -a "$GITHUB_OUTPUT"

  qt-applications-build:
    name: qt-applications build ${{ matrix.platform.name }} Qt ${{ matrix.qt.qt }}
    needs: config
    runs-on: ${{ matrix.platform.runs-on }}
    container: ${{ matrix.platform.container && format(matrix.platform.container, needs.config.outputs.build_python) || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.config.outputs.exclude) }}
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        shell: bash
        run: |
          echo "key=${CACHE_VERSION}-${{ matrix.platform.name }}-qt${{ matrix.qt.qt }}-${{ hashFiles('packages/qt-applications/**', '.github/scripts/platform_tag.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/qt-applications/dist
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          python-version: ${{ needs.config.outputs.build_python }}
      - if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Build wheel
        if: steps.cache.outputs.cache-hit != 'true'
        # Default shell so Git Bash's link does not shadow the MSVC linker.
        run: python -m build --wheel --outdir packages/qt-applications/dist packages/qt-applications
      - name: Retag with the platform the binaries need
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install wheel pyelftools macholib
          python .github/scripts/platform_tag.py packages/qt-applications/dist/*.whl
      - if: steps.cache.outputs.cache-hit != 'true' && github.ref_type != 'tag'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/qt-applications/dist
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-applications-${{ matrix.platform.name }}-qt${{ matrix.qt.qt }}
          path: packages/qt-applications/dist/*.whl
          if-no-files-found: error

  qt-applications-test:
    name: qt-applications test ${{ matrix.platform.name }} Python ${{ matrix.python }} Qt ${{ matrix.qt.qt }}
    needs:
      - config
      - qt-applications-build
    runs-on: ${{ matrix.platform.runs-on }}
    container: ${{ matrix.platform.container && format(matrix.platform.container, matrix.python) || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.config.outputs.exclude) }}
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
        python: ${{ fromJSON(needs.config.outputs.python) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          venv: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-applications-${{ matrix.platform.name }}-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - name: Install
        run: |
          python .github/scripts/constraints.py wheelhouse | tee constraints.txt
          python -m pip install --find-links wheelhouse --constraint constraints.txt qt${{ matrix.qt.major }}-applications pytest pytest-faulthandler ${{ runner.os == 'Linux' && 'pytest-xvfb' || '' }}
          python -m pip freeze --all
      - name: Test
        run: python -m pytest --capture=no --verbose --pyargs qt${{ matrix.qt.major }}_applications.tests

  qt-tools-build:
    name: qt-tools build Qt ${{ matrix.qt.qt }}
    needs:
      - config
      - qt-applications-build
    runs-on: ubuntu-latest
    container: python:${{ needs.config.outputs.build_python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        # qt-tools also inspects the qt-applications wheel while building.
        run: |
          echo "key=${CACHE_VERSION}-qt${{ matrix.qt.qt }}-${{ hashFiles('packages/qt-applications/**', 'packages/qt-tools/**') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/qt-tools/dist
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          python-version: ${{ needs.config.outputs.build_python }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-applications-linux-x86_64-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - name: Build wheel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python .github/scripts/constraints.py wheelhouse | tee constraints.txt
          export PIP_FIND_LINKS="$PWD/wheelhouse"
          export PIP_CONSTRAINT="$PWD/constraints.txt"
          export PIP_BUILD_CONSTRAINT="$PWD/constraints.txt"
          python -m build --wheel --outdir packages/qt-tools/dist packages/qt-tools
      - if: steps.cache.outputs.cache-hit != 'true' && github.ref_type != 'tag'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/qt-tools/dist
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-tools-qt${{ matrix.qt.qt }}
          path: packages/qt-tools/dist/*.whl
          if-no-files-found: error

  qt-tools-test:
    name: qt-tools test ${{ matrix.platform.name }} Python ${{ matrix.python }} Qt ${{ matrix.qt.qt }}
    needs:
      - config
      - qt-applications-build
      - qt-tools-build
    runs-on: ${{ matrix.platform.runs-on }}
    container: ${{ matrix.platform.container && format(matrix.platform.container, matrix.python) || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.config.outputs.exclude) }}
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
        python: ${{ fromJSON(needs.config.outputs.python) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          venv: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-applications-${{ matrix.platform.name }}-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-tools-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - name: Install
        run: |
          python .github/scripts/constraints.py wheelhouse | tee constraints.txt
          python -m pip install --find-links wheelhouse --constraint constraints.txt qt${{ matrix.qt.major }}-tools pytest pytest-faulthandler ${{ runner.os == 'Linux' && 'pytest-xvfb' || '' }}
          python -m pip freeze --all
      - name: Test
        run: python -m pytest --capture=no --verbose --pyargs qt${{ matrix.qt.major }}_tools.tests

  pyqt-plugins-build:
    name: pyqt-plugins build ${{ matrix.platform.name }} Python ${{ matrix.python }} PyQt ${{ matrix.qt.pyqt }}
    needs: config
    runs-on: ${{ matrix.platform.runs-on }}
    container: ${{ matrix.platform.container && format(matrix.platform.container, matrix.python) || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.config.outputs.pyqt_exclude) }}
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
        python: ${{ fromJSON(needs.config.outputs.python) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
      PYQT_VERSION: ${{ matrix.qt.pyqt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.name }}
          PYTHON: ${{ matrix.python }}
        run: |
          echo "key=${CACHE_VERSION}-${PLATFORM}-py${PYTHON}-qt${QT_VERSION}-pyqt${PYQT_VERSION}-${{ hashFiles('packages/pyqt-plugins/**', '.github/scripts/platform_tag.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/pyqt-plugins/dist
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Build wheel
        if: steps.cache.outputs.cache-hit != 'true'
        # Default shell so Git Bash's link does not shadow the MSVC linker.
        run: python -m build --wheel --outdir packages/pyqt-plugins/dist packages/pyqt-plugins
      - name: Retag with the glibc the binaries need
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        # Only the plugin's own libraries count.  The exact PyQt-Qt and
        # qt-tools pins carry the needs of the Qt libraries they load.
        shell: bash
        run: |
          python -m pip install wheel pyelftools macholib
          python .github/scripts/platform_tag.py packages/pyqt-plugins/dist/*.whl
      - name: Retag to the built architecture
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        # The universal2 Python tags the wheel universal2, but the plugin is
        # only built for the runner's architecture.
        shell: bash
        run: |
          python -m pip install wheel
          wheel=$(echo packages/pyqt-plugins/dist/*.whl)
          architecture=$(uname -m)
          platform=$(basename "$wheel" .whl | rev | cut -d- -f1 | rev)
          platform=${platform/universal2/$architecture}
          # Apple Silicon Macs start at macOS 11, so pip never accepts an older
          # arm64 tag.
          if [ "$architecture" = arm64 ] && [ "$(echo "$platform" | cut -d_ -f2)" -lt 11 ]; then
            platform=macosx_11_0_arm64
          fi
          python -m wheel tags --remove --platform-tag "$platform" "$wheel"
          ls packages/pyqt-plugins/dist
      - if: steps.cache.outputs.cache-hit != 'true' && github.ref_type != 'tag'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/pyqt-plugins/dist
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyqt-plugins-${{ matrix.platform.name }}-py${{ matrix.python }}-qt${{ matrix.qt.qt }}-pyqt${{ matrix.qt.pyqt }}
          path: packages/pyqt-plugins/dist/*.whl
          if-no-files-found: error

  pyqt-plugins-test:
    name: pyqt-plugins test ${{ matrix.platform.name }} Python ${{ matrix.python }} PyQt ${{ matrix.qt.pyqt }}
    needs:
      - config
      - qt-applications-build
      - qt-tools-build
      - pyqt-plugins-build
    runs-on: ${{ matrix.platform.runs-on }}
    container: ${{ matrix.platform.container && format(matrix.platform.container, matrix.python) || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.config.outputs.pyqt_exclude) }}
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
        python: ${{ fromJSON(needs.config.outputs.python) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
      PYQT_VERSION: ${{ matrix.qt.pyqt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          venv: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-applications-${{ matrix.platform.name }}-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-tools-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pyqt-plugins-${{ matrix.platform.name }}-py${{ matrix.python }}-qt${{ matrix.qt.qt }}-pyqt${{ matrix.qt.pyqt }}
          path: wheelhouse
      - name: Install
        run: |
          python .github/scripts/constraints.py wheelhouse | tee constraints.txt
          python -m pip install --find-links wheelhouse --constraint constraints.txt pyqt${{ matrix.qt.major }}-plugins pytest pytest-faulthandler ${{ runner.os == 'Linux' && 'pytest-xvfb' || '' }}
          python -m pip freeze --all
      - name: Test
        run: |
          python -c 'import PyQt${{ matrix.qt.major }}.sip; print(PyQt${{ matrix.qt.major }}.sip)'
          python -m pytest --capture=no --verbose --pyargs pyqt${{ matrix.qt.major }}_plugins.tests

  # The plugins load the Python library at runtime, so also test the Linux
  # wheels with Pythons installed somewhere other than the build image's
  # /usr/local.
  pyqt-plugins-test-other-python:
    name: pyqt-plugins test linux-x86_64 ${{ matrix.other.name }} Python ${{ matrix.other.python }} PyQt ${{ matrix.qt.pyqt }}
    needs:
      - config
      - qt-applications-build
      - qt-tools-build
      - pyqt-plugins-build
    runs-on: ubuntu-latest
    container: ${{ matrix.other.container }}
    strategy:
      fail-fast: false
      matrix:
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
        other: ${{ fromJSON(needs.config.outputs.other_pythons) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
      PYQT_VERSION: ${{ matrix.qt.pyqt }}
      PYTHON: ${{ matrix.other.python }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packages
        env:
          OTHER: ${{ matrix.other.name }}
        # Libraries Qt needs that the python:<version>-bookworm images already
        # have.  Ubuntu's Python needs libpython for its shared library.
        run: |
          apt-get update --yes
          apt-get install --yes ca-certificates git libfontconfig1 libglib2.0-0 libgssapi-krb5-2
          if [ "$OTHER" = ubuntu ]; then
            apt-get install --yes "python$PYTHON" "python$PYTHON-venv" "libpython$PYTHON"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.other.name == 'uv'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Create virtualenv
        env:
          OTHER: ${{ matrix.other.name }}
        run: |
          if [ "$OTHER" = uv ]; then
            uv python install "$PYTHON"
            python=$(uv python find --managed-python "$PYTHON")
          else
            python=$(command -v "python$PYTHON")
          fi
          "$python" -m venv "$GITHUB_WORKSPACE/venv"
          echo "$GITHUB_WORKSPACE/venv/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.other.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-applications-linux-x86_64-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-tools-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pyqt-plugins-linux-x86_64-py${{ matrix.other.python }}-qt${{ matrix.qt.qt }}-pyqt${{ matrix.qt.pyqt }}
          path: wheelhouse
      - name: Install
        run: |
          python .github/scripts/constraints.py wheelhouse | tee constraints.txt
          python -m pip install --find-links wheelhouse --constraint constraints.txt pyqt${{ matrix.qt.major }}-plugins pytest pytest-faulthandler pytest-xvfb
          python -m pip freeze --all
      - name: Test
        run: |
          python -c 'import sys, sysconfig; print(sys.base_prefix, sysconfig.get_config_var("LIBDIR"))'
          python -m pytest --capture=no --verbose --pyargs pyqt${{ matrix.qt.major }}_plugins.tests

  pyqt-tools-build:
    name: pyqt-tools build PyQt ${{ matrix.qt.pyqt }}
    needs: config
    runs-on: ubuntu-latest
    container: python:${{ needs.config.outputs.build_python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
      PYQT_VERSION: ${{ matrix.qt.pyqt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: |
          echo "key=${CACHE_VERSION}-qt${{ matrix.qt.qt }}-pyqt${{ matrix.qt.pyqt }}-${{ hashFiles('packages/pyqt-tools/**') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/pyqt-tools/dist
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          python-version: ${{ needs.config.outputs.build_python }}
      - name: Build wheel
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m build --wheel --outdir packages/pyqt-tools/dist packages/pyqt-tools
      - if: steps.cache.outputs.cache-hit != 'true' && github.ref_type != 'tag'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/pyqt-tools/dist
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyqt-tools-qt${{ matrix.qt.qt }}-pyqt${{ matrix.qt.pyqt }}
          path: packages/pyqt-tools/dist/*.whl
          if-no-files-found: error

  pyqt-tools-test:
    name: pyqt-tools test ${{ matrix.platform.name }} Python ${{ matrix.python }} PyQt ${{ matrix.qt.pyqt }}
    needs:
      - config
      - qt-applications-build
      - qt-tools-build
      - pyqt-plugins-build
      - pyqt-tools-build
    runs-on: ${{ matrix.platform.runs-on }}
    container: ${{ matrix.platform.container && format(matrix.platform.container, matrix.python) || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.config.outputs.pyqt_exclude) }}
        qt: ${{ fromJSON(needs.config.outputs.qt) }}
        python: ${{ fromJSON(needs.config.outputs.python) }}
    env:
      QT_VERSION: ${{ matrix.qt.qt }}
      PYQT_VERSION: ${{ matrix.qt.pyqt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          venv: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-applications-${{ matrix.platform.name }}-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qt-tools-qt${{ matrix.qt.qt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pyqt-plugins-${{ matrix.platform.name }}-py${{ matrix.python }}-qt${{ matrix.qt.qt }}-pyqt${{ matrix.qt.pyqt }}
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pyqt-tools-qt${{ matrix.qt.qt }}-pyqt${{ matrix.qt.pyqt }}
          path: wheelhouse
      - name: Install
        run: |
          python .github/scripts/constraints.py wheelhouse | tee constraints.txt
          python -m pip install --find-links wheelhouse --constraint constraints.txt pyqt${{ matrix.qt.major }}-tools pytest pytest-faulthandler ${{ runner.os == 'Linux' && 'pytest-xvfb' || '' }}
          python -m pip freeze --all
      - name: Test
        run: |
          python -c 'import PyQt${{ matrix.qt.major }}.sip; print(PyQt${{ matrix.qt.major }}.sip)'
          python -m pytest --capture=no --verbose --pyargs pyqt${{ matrix.qt.major }}_tools.tests

  all:
    name: all
    # Tag runs that another tag run publishes for build nothing to check.
    if: ${{ !cancelled() && needs.release-plan.outputs.build != 'false' }}
    needs:
      - mise
      - pre-commit
      - release-plan
      - config
      - qt-applications-build
      - qt-applications-test
      - qt-tools-build
      - qt-tools-test
      - pyqt-plugins-build
      - pyqt-plugins-test
      - pyqt-plugins-test-other-python
      - pyqt-tools-build
      - pyqt-tools-test
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  tag-release:
    name: Tag release
    needs: all
    if: >-
      github.repository == 'altendky/pyqt-tools' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release order compares with earlier release tags.
          fetch-depth: 0
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Tags created with GITHUB_TOKEN would not start the release run.
      - run: python3 scripts/release.py tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish
    needs:
      - release-plan
      - all
    if: needs.release-plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      RELEASES: ${{ needs.release-plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'qt-applications')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qt-applications-*
          path: artifacts/qt-applications
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'qt-tools')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qt-tools-*
          path: artifacts/qt-tools
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'pyqt-plugins')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pyqt-plugins-*
          path: artifacts/pyqt-plugins
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'pyqt-tools')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pyqt-tools-*
          path: artifacts/pyqt-tools
      - name: Check wheel names and versions
        run: python3 scripts/release.py collect artifacts dist
      # In dependency order, so each package's requirements are published
      # before it.  skip-existing allows re-running a publish that failed
      # partway through.
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'qt-applications')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/qt-applications/
          skip-existing: true
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'qt-tools')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/qt-tools/
          skip-existing: true
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'pyqt-plugins')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pyqt-plugins/
          skip-existing: true
      - if: contains(fromJSON(needs.release-plan.outputs.packages), 'pyqt-tools')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pyqt-tools/
          skip-existing: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheels
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub Releases
    needs:
      - release-plan
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASES: ${{ needs.release-plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-wheels
          path: dist
      - run: python3 scripts/release.py github-release dist
        env:
          GH_TOKEN: ${{ github.token }}

  post-release:
    name: Post-release PR
    needs:
      - release-plan
      - github-release
    runs-on: ubuntu-latest
    env:
      RELEASES: ${{ needs.release-plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The App's commit is signed by GitHub, and its PR runs CI.
      - run: python3 scripts/release.py post-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
