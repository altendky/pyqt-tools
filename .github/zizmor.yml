rules:
  self-repository:
    ignore:
      # actionlint v1.7.12 rejects self-repository references.
      # Migrate and remove this exception when actionlint supports them.
      - ci.yml
  unpinned-images:
    ignore:
      # The Linux build and test containers are python:<version>-bookworm for
      # each Python in .github/ci-config.json, which a digest can't express.
      # The other-pythons containers come from the same file.
      - ci.yml
